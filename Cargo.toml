[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri", "tools/*"]
# 默认只编译服务端，桌面端的 WebView 依赖要显式用 -p 选中。
default-members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "AGPL-3.0-only"
repository = "https://github.com/WJZ-P/Bamboo"

[workspace.dependencies]
mc-bamboo-auth = { path = "crates/mc-bamboo-auth", version = "0.0.0" }
mc-bamboo-blocks = { path = "crates/mc-bamboo-blocks", version = "0.0.0" }
mc-bamboo-command = { path = "crates/mc-bamboo-command", version = "0.0.0" }
mc-bamboo-core = { path = "crates/mc-bamboo-core", version = "0.0.0" }
mc-bamboo-data = { path = "crates/mc-bamboo-data", version = "0.0.0" }
mc-bamboo-game = { path = "crates/mc-bamboo-game", version = "0.0.0" }
mc-bamboo-loot = { path = "crates/mc-bamboo-loot", version = "0.0.0" }
mc-bamboo-nbt = { path = "crates/mc-bamboo-nbt", version = "0.0.0" }
mc-bamboo-protocol = { path = "crates/mc-bamboo-protocol", version = "0.0.0" }
mc-bamboo-recipes = { path = "crates/mc-bamboo-recipes", version = "0.0.0" }
mc-bamboo-server = { path = "crates/mc-bamboo-server", version = "0.0.0" }
mc-bamboo-storage = { path = "crates/mc-bamboo-storage", version = "0.0.0" }
mc-bamboo-world = { path = "crates/mc-bamboo-world", version = "0.0.0" }
mc-bamboo-worldgen = { path = "crates/mc-bamboo-worldgen", version = "0.0.0" }

aes = "0.8"
bytes = "1.12.1"
cfb8 = "0.8"
flate2 = "1.1.11"
hmac = "0.12.1"
# 只在类 Unix 平台上用来查线程的栈范围（见 mc-bamboo-protocol 的 stack_hop）。
libc = "0.2"
md-5 = "0.10"
# 用系统自带的 TLS（Windows 是 schannel），这台机器上没有 rustls 后端需要的汇编工具链。
native-tls = "0.2"
rand_core = { version = "0.6", features = ["getrandom"] }
rsa = "0.9"
serde = { version = "1", features = ["derive"] }
# 官方导出的十进制 double 要按 IEEE 754 正确舍入读回来。默认的快路径用
# `significand * 10^exp`，少数 17 位有效数字会差一个最低位，世界生成的数据里就有六个。
# 同一个依赖在整个依赖图里特性是并集，所以这里统一打开，别让读数据的 crate 和
# 写数据的 crate 用不同的解析器。
#
# Officially exported decimal doubles must be parsed with correct IEEE 754
# rounding. The default fast path (`significand * 10^exp`) loses one ulp on a
# few 17-digit values, including six in the worldgen data. Cargo unifies
# features across the dependency graph, so enable it once for every crate.
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha1 = "0.10"
sha2 = "0.10.9"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal", "sync"] }
tokio-native-tls = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1.44"
toml = "1.2.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
