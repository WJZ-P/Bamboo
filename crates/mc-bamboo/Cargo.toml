[package]
name = "mc-bamboo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A Minecraft server written from scratch in Rust."
readme = "../../README.md"
keywords = ["minecraft", "server"]
categories = ["games"]

[[bin]]
name = "bamboo"
path = "src/main.rs"

[dependencies]
bytes = "1.12.1"
mc-bamboo-protocol = { version = "0.0.0", path = "../mc-bamboo-protocol" }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
