[package]
name = "mc-bamboo-worldgen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "World generation math of the Bamboo Minecraft server: random sources, noise, density functions and biomes."
keywords = ["minecraft"]
categories = ["games"]

[features]
default = []
# 只给 `mc-bamboo-vanilla wg-perf` 用的计时和高度分布钩子。默认构建里全是空操作，
# 行为和生成结果都不变（见 `src/perf.rs`）。
# Timing and height-bucket hooks only for `mc-bamboo-vanilla wg-perf`. Every hook is a
# no-op in default builds, so behaviour and generated blocks are unchanged.
perf = []

[dependencies]
mc-bamboo-blocks.workspace = true
mc-bamboo-core.workspace = true
mc-bamboo-data.workspace = true
mc-bamboo-nbt.workspace = true
md-5.workspace = true
sha2.workspace = true
serde_json.workspace = true
