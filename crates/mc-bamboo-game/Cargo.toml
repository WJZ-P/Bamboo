[package]
name = "mc-bamboo-game"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "World thread of the Bamboo Minecraft server: the single owner of all game state."
keywords = ["minecraft", "server"]
categories = ["games"]

[features]
default = []
# 只给 mc-bamboo-vanilla 的官方 codec 对拍用；正式构建不编进库里。
# Only for the mc-bamboo-vanilla official-codec comparison; off in production.
oracle-samples = []

[dependencies]
mc-bamboo-blocks.workspace = true
mc-bamboo-loot.workspace = true
mc-bamboo-command.workspace = true
mc-bamboo-core.workspace = true
mc-bamboo-data.workspace = true
mc-bamboo-nbt.workspace = true
mc-bamboo-protocol.workspace = true
mc-bamboo-recipes.workspace = true
mc-bamboo-storage.workspace = true
mc-bamboo-world.workspace = true
mc-bamboo-worldgen.workspace = true
md-5.workspace = true
rsa.workspace = true
serde_json.workspace = true
sha1 = { workspace = true, features = ["oid"] }
sha2 = { workspace = true, features = ["oid"] }
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
rand_core.workspace = true
serde_json.workspace = true
