[package]
name = "mc-bamboo-loadtest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Synthetic Minecraft protocol players and a baseline load test for the Bamboo server."
publish = false

[[bin]]
name = "bamboo-loadtest"
path = "src/main.rs"

[dependencies]
mc-bamboo-data.workspace = true
mc-bamboo-nbt.workspace = true
mc-bamboo-protocol.workspace = true
mc-bamboo-server.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
mc-bamboo-core.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
