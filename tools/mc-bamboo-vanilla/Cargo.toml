[package]
name = "mc-bamboo-vanilla"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Development tools of the Bamboo Minecraft server that work with the official server."
publish = false

[features]
default = ["oracle", "probe-online"]
# 这几个 crate 依赖生成的数据。生成文件坏了的时候用 --no-default-features 编译，generate 才跑得起来。
oracle = [
    "dep:mc-bamboo-blocks",
    "dep:mc-bamboo-core",
    "dep:mc-bamboo-data",
    "dep:mc-bamboo-recipes",
    "dep:mc-bamboo-world",
]
# probe 里开了 online_mode 的那一项检查，要在工具进程里再起一个服务端。
probe-online = ["dep:mc-bamboo-server", "dep:tokio"]

[dependencies]
mc-bamboo-blocks = { workspace = true, optional = true }
mc-bamboo-core = { workspace = true, optional = true }
mc-bamboo-data = { workspace = true, optional = true }
mc-bamboo-recipes = { workspace = true, optional = true }
mc-bamboo-server = { workspace = true, optional = true }
mc-bamboo-world = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, optional = true }
